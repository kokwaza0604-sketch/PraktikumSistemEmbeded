; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags = 
	-D USE_HAL_DRIVER
	-D STM32F103xB
	-D HSE_VALUE=8000000
	-I include
	
; Use framework-provided FreeRTOS port via extra script
extra_scripts = pre:extra_script_freertos.py
; lib_deps intentionally empty (project uses framework FreeRTOS)
; lib_deps = aceinna/OpenRTK-base-library@^1.0.9  ; removed — OpenRTK is STM32F4-specific and breaks build for bluepill_f103c8
